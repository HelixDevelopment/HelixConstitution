# ============================================================================
# reporting.example.yaml — CONSUMER-OWNED config for the §11.4.202 reporting
# directives (ISSUE / BUG / TASK) and their item-creation + full-sync engine
# (constitution/scripts/reporting/report_item.sh).
# ============================================================================
#
# Copy this file into YOUR project (NEVER edit the engine — §11.4.28 decoupling):
#
#     mkdir -p .helix && cp constitution/scripts/reporting/reporting.example.yaml \
#                           .helix/reporting.yaml
#
# The engine searches, in order:
#   1. $HELIX_REPORTING_CONFIG
#   2. <project-root>/.helix/reporting.yaml
#   3. <project-root>/config/reporting/reporting.yaml
#
# Everything below is DATA. The engine carries zero project literals; it refuses
# to guess any of these values (§11.4.6 no-guessing) and fails closed with an
# actionable message when the config is absent.
# ============================================================================

schema_version: 1

# ── The workable-items SQLite single-source-of-truth (§11.4.93 / §11.4.95) ────
# Path relative to the project root (or absolute). MUST already exist.
db: docs/workable_items.db

# ── Ticket-id prefix (§11.4.54). Ids are <PREFIX>-NNN, monotonic, never reused.
# Omit to accept the workable-items binary's own default.
id_prefix: WIT

# ── Default severity when the caller passes no --severity.
default_severity: Medium

# ── Default `created_by` attribution (§11.4.104) when no --reported-by is given.
default_reported_by: Operator

# ── The FULL doc-sync command (§11.4.106 / §11.4.12 / §11.4.53 / §11.4.65).
# Run from the project root after the item lands in the DB. It MUST regenerate
# every derived document FROM the DB (Issues / Fixed / summaries + HTML / PDF /
# DOCX siblings). `{db}` is substituted with the resolved DB path.
#
# Leave EMPTY to skip the sync step — the engine then reports an honest
# SKIP-with-reason (§11.4.3) rather than inventing a command.
sync_command: ""
# Example (a project whose sync wrapper drives export + docs_chain):
#   sync_command: bash scripts/testing/workable_items_sync_all.sh --db {db}

# ── Where captured evidence is written (§11.4.5 / §11.4.69).
evidence_dir: qa-results/reporting

# ── Optional explicit workable-items binary (else: $WORKABLE_ITEMS_BIN, then the
# committed constitution binary, then a fresh `go build`).
# workable_items_bin: constitution/scripts/workable-items/bin/workable-items

# ── External trackers (§11.4.148 D5) ─────────────────────────────────────────
# Each entry is pushed after the DB + docs are in sync.
#
#   name          — label used in the verdict + evidence filename
#   command       — the push command, run from the project root.
#                   `{db}` and `{id}` are substituted.
#                   EMPTY command ⇒ honest SKIP (`tracker_client_absent`) —
#                   the correct state for a tracker whose client is not built yet.
#   required_env  — env vars that MUST be non-empty for the push to run.
#                   The engine tests PRESENCE ONLY — it never reads, prints, or
#                   logs a credential VALUE (§11.4.10). Any missing var ⇒ honest
#                   SKIP (`credentials_absent: unset env: NAME …`). NEVER a fake push.
#   env_passthrough — extra env injected into the command (values may use {db}/{id}).
trackers: []
# Example:
# trackers:
#   - name: clickup
#     command: bash tools/task_bridge/scripts/task_bridge_sync.sh --apply
#     required_env: [CLICKUP_API_KEY, CLICKUP_LIST_ID]
#     env_passthrough:
#       TASK_BRIDGE_DB: "{db}"
#   - name: helixtrack
#     command: ""            # no client yet ⇒ honest SKIP, never a faked push
#     required_env: [HELIXTRACK_API_URL, HELIXTRACK_API_TOKEN]
