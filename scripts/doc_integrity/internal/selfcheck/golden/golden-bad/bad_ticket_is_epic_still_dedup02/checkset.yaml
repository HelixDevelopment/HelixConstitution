schema_version: 1
# GOLDEN-BAD (anti-over-suppression for ticket_is_epic): the flag is ON (so
# DEDUP-01 ticket-on-many-rows is suppressed), but the SAME feature
# (subject+scope) appears twice with a DIVERGENT deadline — the operator's exact
# named defect. DEDUP-02 MUST still FAIL. Proves ticket_is_epic scopes ONLY
# DEDUP-01, never the subject+scope crisis check.
sources:
  - id: plan
    kind: markdown-table
    path: plan.md
    ticket_is_epic: true
    columns:
      item_id: "№"
      ticket: "Ticket"
      name_en: "Task"
      scope: "Scope"
      start: "Start"
      deadline: "Deadline"
dedup:
  key_fields: [subject_norm, scope_norm]
  ticket_field: ticket
