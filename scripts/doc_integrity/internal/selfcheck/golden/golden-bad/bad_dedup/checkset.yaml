    kind: markdown-table
    path: plan.md
    columns:
      item_id: "№"
      ticket: "Ticket"
      name_en: "Task"
      scope: "Scope"
      start: "Start"
      deadline: "Deadline"
dedup:
  key_fields: [subject_norm, scope_norm]
  ticket_field: ticket
