schema_version: 1
# GOLDEN-GOOD (DEDUP exempt_statuses) — §11.4.90 / §11.4.214 / §11.4.201(1).
#
# A duplicate that has been RETIRED through the sanctioned closure path
# (§11.4.90 `Obsolete` with reason `duplicate-of`, §11.4.214 clause (5): the
# already-minted duplicate is LINKED and closed, NEVER renumbered or deleted)
# necessarily keeps the canonical item's subject — that is the whole point of
# the closure. Grouping the RETIRED record with its CANONICAL sibling and
# reporting DEDUP-02 refuses the CORRECT resolution of a duplicate, i.e. a
# §11.4.201(1) FALSE-POSITIVE refusal (a FAIL-bluff), so this MUST PASS.
#
# LOAD-BEARING (the §1.1 mutation): delete `exempt_statuses` below — or delete
# the exempt-status skip in check.dedup02SubjectScope — and DEDUP-02 fires on
# the retired/canonical pair → this fixture FAILs.
#
# NARROWNESS is proven by the sibling golden-bad fixture
# `golden-bad/bad_dedup_exempt_status_still_dedup02`: with the SAME
# exempt_statuses configured, two NON-exempt (live) records sharing the key
# still FAIL DEDUP-02 — the exemption removes only retired records, never the
# check.
sources:
  - id: tracker
    kind: markdown-table
    path: plan.md
    columns:
      item_id: "№"
      ticket: "Ticket"
      name_en: "Task"
      scope: "Scope"
      status: "Status"
dedup:
  key_fields: [subject_norm, scope_norm]
  ticket_field: ticket
  # Consumer-declared closed-set of statuses whose records are RETIRED and are
  # therefore excluded from DEDUP-02 grouping (§11.4.35 — the vocabulary is
  # consumer DATA; the engine carries no project literal).
  exempt_statuses:
    - "Obsolete (→ Fixed.md)"
